<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="1WordAway: a multiplayer word game. Type the same word to level up.">
<title>1WordAway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: one centered column (900px). Home = hero with a live typing demo, then pickers. Game = HUD (level path + hearts), mirrored arenas (player left, timer middle, player right), then round history. Motif: keycaps and two typed words that meet. */
:root{
  --bg:#0f0d1b; --bg-2:#161329; --panel:#1b1731; --panel-2:#242043; --line:#352f58; --cap:#2a2550; --cap-2:#1f1b3d; --cap-edge:#120f26;
  --ink:#f5f1ff; --mute:#aba4cc; --dim:#726b99;
  --tang:#ff8f5e; --tang-d:#b4552f; --sky:#5ec4ff; --lilac:#c6a0ff; --mint:#74e3b0; --sun:#ffd166; --rose:#ff5f8f;
  --good:#74e3b0; --bad:#ff6b6b;
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);min-height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(600px 600px at 6% 0%,color-mix(in srgb,var(--tang) 20%,transparent),transparent 70%),
             radial-gradient(640px 640px at 100% 100%,color-mix(in srgb,var(--sky) 17%,transparent),transparent 70%),
             radial-gradient(500px 400px at 60% 40%,color-mix(in srgb,var(--lilac) 7%,transparent),transparent 70%)}
/* living background: aurora blobs + drifting keycaps (above body bg, below content) */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(70px);opacity:.42;transition:opacity .6s}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:52vmax;height:52vmax;background:var(--tang);top:-22vmax;left:-14vmax}
.aurora i:nth-child(2){width:56vmax;height:56vmax;background:var(--sky);bottom:-26vmax;right:-16vmax}
.aurora i:nth-child(3){width:34vmax;height:34vmax;background:var(--lilac);top:28%;left:34%;opacity:.7}
.aurora i:nth-child(4){width:22vmax;height:22vmax;background:var(--rose);top:8%;right:6%;opacity:.55}
@media (prefers-reduced-motion:no-preference){
  .aurora i:nth-child(1){animation:au1 16s ease-in-out infinite alternate}
  .aurora i:nth-child(2){animation:au2 19s ease-in-out infinite alternate}
  .aurora i:nth-child(3){animation:au3 13s ease-in-out infinite alternate}
  .aurora i:nth-child(4){animation:au4 11s ease-in-out infinite alternate}
}
@keyframes au1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes au2{to{transform:translate(-16vw,-18vh) scale(1.1)}}
@keyframes au3{to{transform:translate(-22vw,12vh) scale(.8)}}
@keyframes au4{to{transform:translate(-30vw,30vh) scale(1.3)}}
body.in-game .aurora{opacity:.2}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px;flex-wrap:wrap}
.top-right{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em;background:none;border:0;cursor:pointer;padding:0}
.brand .logo{display:flex;gap:3px}
.brand .logo span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:800;color:#1a0f14;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.brand .w{color:var(--sun)}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line)}
.lang button{border:0;background:transparent;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--mute);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sun);color:#1d1505}
.stream{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--mute);cursor:pointer}
.stream[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#1f0710}
.masked{-webkit-text-security:disc}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);font-size:12.5px;color:var(--mute);white-space:nowrap;backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.dot.warn{background:var(--sun)}
.dot.off{background:var(--bad)}
.banner{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px;color:var(--mute)}
.banner b{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:8px 28px}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr);gap:20px}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);margin-bottom:12px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,6.4vw,62px);line-height:.98;letter-spacing:-.035em;margin:0 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(95deg,var(--tang) 0%,var(--sun) 45%,var(--sky) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;color:var(--mute);max-width:52ch;font-size:15.5px}
.demo{position:relative;padding:18px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--panel-2) 92%,transparent),color-mix(in srgb,var(--panel) 92%,transparent));border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);display:grid;gap:12px}
.demo-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);font-weight:600}
.demo-top .t{font-family:var(--f-mono);color:var(--sun)}
.demo-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.demo-col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.demo-link{font-size:20px;color:var(--dim);font-weight:800}
.kf{width:100%;min-width:0;height:52px;border-radius:14px;background:var(--bg-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 8px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;transition:border-color .25s,box-shadow .25s,background .25s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kf .caret{display:inline-block;width:2.5px;height:26px;background:var(--sun);margin-left:2px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){.kf .caret{animation:blink 1s steps(1) infinite}}
@keyframes blink{50%{opacity:0}}
.kf.hit{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 12%,var(--bg-2));box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 18%,transparent)}
.kf.off{border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
.kf.seed{border-color:color-mix(in srgb,var(--lilac) 70%,var(--line));background:color-mix(in srgb,var(--lilac) 12%,var(--bg-2))}
.demo-res{height:30px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;text-align:center}
.demo-res.good{color:var(--sun)}
.demo-res.bad{color:var(--bad)}
.demo-res.seed{color:var(--lilac)}

.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin:24px 0 10px}
.card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(8px)}
.me{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.me label{font-size:13px;color:var(--mute)}
.field{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.inp{width:100%;background:var(--bg-2);border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;caret-color:var(--sun)}
.inp:focus{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 15%,transparent)}

.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,transform .15s,box-shadow .2s;min-width:0}
.opt:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--sun) 45%,var(--line))}
.opt[aria-pressed="true"]{border-color:transparent;background:linear-gradient(var(--panel-2),var(--panel-2)) padding-box,linear-gradient(120deg,var(--tang),var(--sun),var(--sky)) border-box;box-shadow:0 14px 34px -14px color-mix(in srgb,var(--sun) 55%,transparent)}
.opt .gl{flex:none;width:52px;height:40px}
.opt .gl circle{mix-blend-mode:screen}
.opt b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.opt small{display:block;color:var(--mute);font-size:13px;line-height:1.35}
.opt .q{position:absolute;top:9px;right:11px;font-size:11px;color:var(--mint);font-weight:700}
.opt .lvtag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:var(--sun);background:color-mix(in srgb,var(--sun) 13%,transparent);padding:1px 7px;border-radius:6px}
.opt .lvtag.race{color:var(--sky);background:color-mix(in srgb,var(--sky) 13%,transparent)}

.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;align-items:stretch}
/* keycap buttons */
.btn{--face:var(--cap);--edge:var(--cap-edge);display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;border:1px solid color-mix(in srgb,var(--line) 80%,white 8%);background:linear-gradient(180deg,color-mix(in srgb,var(--face) 100%,white 6%),var(--face));box-shadow:0 4px 0 var(--edge),0 10px 20px -10px rgba(0,0,0,.6);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;position:relative}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge),0 4px 10px -6px rgba(0,0,0,.6)}
.btn.primary{--face:var(--tang);--edge:var(--tang-d);color:#1d0f07;border-color:color-mix(in srgb,var(--tang) 70%,white)}
.btn.gold{--face:var(--sun);--edge:#a8812a;color:#1d1505;border-color:color-mix(in srgb,var(--sun) 70%,white)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.ghost:active{transform:translateY(1px)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.big{padding:15px 24px;font-size:17px;font-family:var(--f-display);font-weight:800}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.join{display:flex;gap:10px;flex:1 1 260px;min-width:0}
.join .inp{text-transform:uppercase;letter-spacing:.32em;font-family:var(--f-mono);font-weight:800;text-align:center;min-width:0;font-size:18px}

.rules{margin-top:30px;color:var(--mute)}
.rules summary{cursor:pointer;color:var(--ink);font-weight:700;font-family:var(--f-display);font-size:17px}
.rules ul{padding-left:20px;margin:12px 0 0;display:grid;gap:7px;max-width:68ch}
.rules b{color:var(--ink)}
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.ladder span{font-family:var(--f-mono);font-size:12px;padding:5px 8px;border-radius:9px;background:var(--cap-2);border:1px solid var(--line);border-bottom-width:3px;color:var(--ink)}
.ladder span i{font-style:normal;color:var(--rose)}
.ladder span.boss{border-color:var(--sun);color:var(--sun)}

/* queue */
.queue{text-align:center;padding:40px 18px}
.radar{width:130px;height:130px;margin:0 auto 18px;position:relative}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--tang);opacity:0}
@media (prefers-reduced-motion:no-preference){.radar span{animation:ping 2.4s ease-out infinite}.radar span:nth-child(2){animation-delay:.8s;border-color:var(--sky)}.radar span:nth-child(3){animation-delay:1.6s;border-color:var(--lilac)}}
@media (prefers-reduced-motion:reduce){.radar span{opacity:.5}}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
.queue h2{font-family:var(--f-display);font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.queue p{color:var(--mute);margin:0 0 6px}
.big-count{font-family:var(--f-mono);font-size:24px;font-weight:800;color:var(--ink)}

/* room lobby */
.room-top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.code-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code{display:flex;gap:6px;user-select:all}
.code span{width:52px;height:60px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:800;font-size:32px;border-radius:13px;background:linear-gradient(180deg,var(--cap),var(--cap-2));border:1px solid var(--line);box-shadow:0 5px 0 var(--cap-edge)}
.muted{color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg-2);font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s}
.chip:hover:not([disabled]){border-color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--sun);color:var(--sun);background:color-mix(in srgb,var(--sun) 10%,var(--bg-2))}
.chip[disabled]{cursor:default}
.slots{display:grid;gap:8px}
.slots.row .slot{flex-direction:column;justify-content:center;text-align:center;padding:14px 8px;gap:6px;min-height:110px}
.slots.row .slot .nm{max-width:100%}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.teams{grid-template-columns:1fr}}
.team h4{margin:0 0 8px;font-family:var(--f-display);font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.slot{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);min-height:52px;min-width:0}
.slot.empty{border-style:dashed;color:var(--dim);justify-content:center;font-size:13.5px}
.slot .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:var(--panel-2);color:var(--mute);flex:none}
.tag.host{color:var(--sun)}
.tag.you{color:var(--mint)}
.av{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:#140d1d;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.langnote{margin:10px 0 0;font-size:13.5px;color:var(--mute)}
.langnote b{color:var(--sun)}

/* game */
.g-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.g-meta{display:flex;flex-wrap:wrap;gap:6px}
/* board: coop = one arena; 2v2 = two mirrored arenas side by side, controls under your team */
.g-board{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.g-board.vs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#g-arenas{display:contents}
.g-board .arena{grid-row:1}
.g-board.vs .arena[data-t="0"]{grid-column:1}
.g-board.vs .arena[data-t="1"]{grid-column:2}
#g-controls{grid-row:2;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0}
@media (max-width:760px){.g-board.vs{grid-template-columns:minmax(0,1fr)}.g-board.vs .arena,.g-board.vs #g-controls{grid-column:1!important;grid-row:auto!important}}

.hud{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px;padding:14px 16px;text-align:center}
.hud .path{width:100%;max-width:560px}
.hud-mid{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.lv{display:flex;align-items:center;gap:12px;text-align:left}
.lv-badge{width:66px;height:66px;border-radius:18px;display:grid;place-content:center;text-align:center;background:linear-gradient(160deg,var(--sun),var(--tang));color:#1d1206;box-shadow:0 5px 0 var(--tang-d),0 16px 30px -12px color-mix(in srgb,var(--sun) 60%,transparent)}
.lv-badge small{font-size:9.5px;font-weight:800;letter-spacing:.16em}
.lv-badge b{font-family:var(--f-display);font-size:30px;line-height:.95;font-weight:800}
.lv-badge.boss{background:linear-gradient(160deg,#fff1b8,var(--sun) 40%,var(--rose));box-shadow:0 5px 0 #8f3550,0 16px 34px -10px color-mix(in srgb,var(--rose) 70%,transparent)}
@media (prefers-reduced-motion:no-preference){.lv-badge.pop{animation:lvpop .7s cubic-bezier(.2,.9,.3,1.5)}}
@keyframes lvpop{0%{transform:scale(.5) rotate(-12deg)}60%{transform:scale(1.18) rotate(4deg)}}
.lv-txt b{display:block;font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.01em}
.lv-txt span{font-size:12.5px;color:var(--mute)}
.path{display:flex;align-items:center;gap:0;min-width:0}
.path i{flex:1;height:3px;background:var(--line);min-width:4px}
.path i.on{background:linear-gradient(90deg,var(--tang),var(--sun))}
.path span{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:800;background:var(--cap-2);border:1px solid var(--line);color:var(--dim)}
.path span.done{background:var(--sun);border-color:var(--sun);color:#1d1505}
.path span.cur{background:var(--bg-2);border:2px solid var(--sun);color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 20%,transparent)}
.path span.crown{font-size:13px}
.hearts-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hearts{display:grid;grid-template-columns:repeat(10,18px);gap:4px}
.hearts svg{width:18px;height:18px;display:block}
.hearts .f path{fill:var(--rose);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--rose) 60%,transparent))}
.hearts .e path{fill:none;stroke:var(--line);stroke-width:2}
@media (prefers-reduced-motion:no-preference){.hearts .lost{animation:heartbreak .9s ease-out}.hearts .gain{animation:heartgain .5s cubic-bezier(.2,.9,.3,1.6) both}}
.hearts .lost path{animation:lostfill .9s ease-out forwards}
@keyframes lostfill{0%{fill:var(--rose);stroke:var(--rose)}100%{fill:transparent;stroke:var(--line)}}
@keyframes heartbreak{0%{transform:scale(1.5);filter:drop-shadow(0 0 10px var(--rose))}40%{transform:scale(1.3) rotate(-14deg)}100%{transform:none}}
@keyframes heartgain{from{transform:scale(0)}}

.ring{position:relative;width:156px;height:156px}

.hist h3{margin:0 0 10px;font-family:var(--f-display);font-size:16px;text-align:center}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:blur(7px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

    const a = ['Sleepy','Swift','Dreamy','Clever','Sneaky','Gentle','Mystic','Lucky'], b = ['Fox','Panda','Owl','Otter','Tiger','Penguin','Koala','Bunny'];
    return a[Math.random() * a.length | 0] + ' ' + b[Math.random() * b.length | 0];
  }
  const a = ['Mèo','Cáo','Gấu','Cú','Thỏ','Hổ','Sóc','Rái cá','Cánh cụt','Gà'], b = ['Lười','Tinh Ý','Mơ Màng','Lém Lỉnh','Hiền','Nhanh Nhảu','Bí Ẩn'];
  return a[Math.random() * a.length | 0] + ' ' + b[Math.random() * b.length | 0];
}
S.name = store.get('name', '') || randomName(S.lang);

// random words and topics follow the ROOM's language, not each viewer's
function pickWords(n, lang) {
  const list = WORDS[lang] || WORDS.vi, out = [];
  while (out.length < n) { const w = list[Math.random() * list.length | 0]; if (!out.includes(w)) out.push(w); }
  return out;
}
function randTopic(not, lang) { const list = TOPICS[lang] || TOPICS.vi; let x; do x = list[Math.random() * list.length | 0]; while (x === not); return x; }

// ---------- network: WebSocket to our own server ----------
function makeWsNet() {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  let me = 'p' + Math.random().toString(36).slice(2, 12).replace(/[^a-z0-9]/g, '') + 'x';
  let ws = null, open = false, offset = null;
  const rooms = new Map(), connHs = new Set(), tickHs = new Set();
  const send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
  // server clock: a message is never received before it is sent, so the largest observed offset is the closest
  const seeClock = now => { if (typeof now !== 'number') return; const o = now - Date.now(); if (offset == null || o > offset) offset = o; };
  function mk(name) {
    let mine = {}, myAt = Date.now(), list = [], snap = Object.freeze([]), pend = false;
    const hs = new Set();
    const rebuild = () => {
      snap = Object.freeze([
        { peer: me, isMe: true, sameTab: true, kind: 'viewer', presence: mine, updatedAt: myAt },
        ...list.filter(p => p.peer !== me).map(p => ({ peer: p.peer, isMe: false, sameTab: false, kind: 'viewer', presence: p.presence, updatedAt: p.at })),
      ]);
      if (!pend) { pend = true; setTimeout(() => { pend = false; hs.forEach(h => h({ peers: snap })); }, 0); }
    };
    const r = {
      name,
      presence(patch) { mine = { ...mine }; for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; } myAt = Date.now(); send({ t: 'presence', room: name, patch }); rebuild(); return Promise.resolve(); },
      peers: () => snap,
      onPeers(h) { hs.add(h); setTimeout(() => h({ peers: snap }), 0); return () => hs.delete(h); },
      onConnection(h) { connHs.add(h); setTimeout(() => h(open), 0); return () => connHs.delete(h); },
      leave() { send({ t: 'leave', room: name }); rooms.delete(name); hs.clear(); return Promise.resolve(); },
      _set(peers) {
        list = peers.map(p => {
          const old = list.find(o => o.peer === p.peer);
          return old && JSON.stringify(old.presence) === JSON.stringify(p.presence) ? old : { peer: p.peer, presence: Object.freeze(p.presence || {}), at: Date.now() };
        });
        rebuild();
      },
      _join() { send({ t: 'join', room: name, presence: mine }); },
      _rebuild: () => rebuild(),
    };
    rooms.set(name, r); r._join(); rebuild();
    return r;
  }
  function connect() {
    ws = new WebSocket(url + '?id=' + me);
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === 'hello') {
        seeClock(m.now);
        if (m.id !== me) { me = m.id; rooms.forEach(r => r._rebuild()); }
        open = true; rooms.forEach(r => r._join()); connHs.forEach(h => h(true));
      } else if (m.t === 'peers') { const r = rooms.get(m.room); if (r) r._set(m.peers || []); }
      else if (m.t === 'tick') { seeClock(m.now); tickHs.forEach(h => h()); }
    };
    ws.onclose = () => { if (open) { open = false; connHs.forEach(h => h(false)); } setTimeout(connect, 1500); };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  connect();
  const lobby = mk('__lobby');
  lobby.join = async n => rooms.get(n) || mk(n);
  lobby.now = () => Date.now() + (offset || 0);
  lobby.onTick = h => tickHs.add(h);
  return lobby;
}
// shared clock: every timer in the game is measured against server time, so all players count down together
const now = () => (S.lobby && S.lobby.now ? S.lobby.now() : Date.now());

// ---------- helpers on room state ----------
const myPeer = () => { const r = S.room || S.lobby; const p = r && r.peers().find(p => p.isMe && p.sameTab); return p ? p.peer : null; };
const pres = peer => (S.byPeer[peer] && S.byPeer[peer].presence) || {};
const pName = peer => pres(peer).name || t('someone');
function pCol(peer) { const i = S.ps.findIndex(p => p.peer === peer); return PCOLS[(i < 0 ? 2 : i) % PCOLS.length]; }
const avatar = peer => `<span class="av" style="background:var(--${pCol(peer)})">${esc((pName(peer).trim()[0] || '?').toUpperCase())}</span>`;
function pub(patch) { if (S.room) S.room.presence(patch).catch(() => {}); }
const myTeam = () => { const G = S.G, me = myPeer(); if (!G || !G.members) return -1; return G.members.findIndex(a => a.includes(me)); };
const dispTeam = () => Math.max(0, myTeam());
const isCoop = G => G && MODES[G.mode] && MODES[G.mode].levels;
const roomLang = () => (S.G && LANGS.includes(S.G.lang) ? S.G.lang : S.lang);
const phaseEl = tm => (tm && tm.at ? now() - tm.at : 0);
const teamName = i => t('teams')[i];
function wordsOf(peer) {
  if (peer === myPeer()) return S.my.words;
  const p = pres(peer); return (S.G && p.wg === S.G.id && Array.isArray(p.words)) ? p.words : [];
}
function usedWords(ti) {
  const set = new Set(); const G = S.G; if (!G || !G.members[ti]) return set;
  const from = isCoop(G) ? (G.lvStart || 1) : 1;
  for (const m of G.members[ti]) wordsOf(m).forEach((w, i) => { if (w && i + 1 >= from) set.add(norm(w)); });
  const tm = G.teams && G.teams[ti];
  if (tm && tm.seeds) for (const r in tm.seeds) if (+r >= from) tm.seeds[r].forEach(w => set.add(norm(w)));
  return set;
}
// the words shown for round r: random seeds for opening rounds, otherwise each member's typed word
function roundWords(ti, r) {
  const G = S.G, tm = G.teams && G.teams[ti];
  if (tm && tm.seeds && tm.seeds[r]) return tm.seeds[r];
  return ((G.members && G.members[ti]) || []).map(p => wordsOf(p)[r - 1]);
}

// ---------- network wiring ----------
async function initNet() {
  let api;
  try { api = makeWsNet(); } catch { S.net = 'offline'; render(); return; }
  S.lobby = api; S.net = 'online';
  api.onPeers(() => { matchTick(); scheduleRender(); });
  api.onConnection(c => { S.connected = c; scheduleRender(); });
  api.onTick(() => hostTick());
  api.presence({ v: 1, name: S.name, lang: S.lang }).catch(() => {});
  render();
}

async function joinRoom(name, kind) {
  if (!S.lobby) { toast(t('notConnected')); return; }
  if (S.joining) return;
  S.joining = true;
  let r;
  try {
    if (S.room) await leaveRoom(true, true);
    r = await S.lobby.join(name);
  } catch (e) {
    S.joining = false;
    toast(e && e.code === 'limit_reached' ? t('busy') : t('cantJoin')); return;
  }
  S.joining = false;
  Object.assign(S, { room: r, roomName: name, roomKind: kind, roomJoinAt: Date.now(), ja: 0, G: null, hostG: null, lastPub: '', pending: null,
    my: { gid: null, words: [], lock: null }, ps: [], byPeer: {}, amHost: false, hostPeer: null, hpSeen: null });
  S.missing.clear(); S.keys = {};
  S.screen = 'room';
  r.onPeers(() => sync());
  await r.presence({ name: S.name, lang: S.lang }).catch(() => {});
  render();
  await sleep(900);
  if (S.room !== r) return;
  const others = r.peers().filter(p => !(p.isMe && p.sameTab) && p.presence && p.presence.ja);
  const maxJa = others.reduce((m, p) => Math.max(m, +p.presence.ja || 0), 0);
  S.ja = Math.max(Date.now(), maxJa + 1);
  const t0 = others.filter(p => (p.presence.team | 0) === 0).length, t1 = others.filter(p => p.presence.team === 1).length;
  await r.presence({ v: 1, ja: S.ja, name: S.name, lang: S.lang, team: t1 < t0 ? 1 : 0 }).catch(() => {});
  sync();
}

async function leaveRoom(silent, keepSeek) {
  const r = S.room;
  S.room = null; S.G = null; S.hostG = null; S.roomName = ''; S.amHost = false;
  if (r) { try { await r.leave(); } catch {} }
  if (S.seeking && !keepSeek) { S.seeking = null; S.lobby && S.lobby.presence({ seek: null }).catch(() => {}); }
  if (!silent) { S.screen = 'home'; render(); }
}

// queue room names: q-<lang>-<mode>-<type>-<hash>
function newLobbyG() {
  let mode = S.mode, type = S.type, lang = S.lang, auto = false;
  if (S.roomKind === 'queue') { const p = S.roomName.split('-'); if (LANGS.includes(p[1])) lang = p[1]; if (MODES[p[2]]) mode = p[2]; if (TYPES[p[3]]) type = p[3]; auto = true; }
  return { id: 0, mode, type, lang, st: 'lobby', auto, members: [], teams: [], topic: null, win: null, why: null };
}

function publishG() {
  const s = JSON.stringify(S.hostG);
  if (s !== S.lastPub) { S.lastPub = s; pub({ g: JSON.parse(s) }); }
  S.G = S.hostG; clientReact(); scheduleRender();
}

function sync() {
  if (!S.room) return;
  const ps = S.room.peers().filter(p => p.presence && p.presence.v === 1 && p.presence.ja)
    .slice().sort((a, b) => (a.presence.ja - b.presence.ja) || (a.peer < b.peer ? -1 : 1));
  S.ps = ps; S.byPeer = {}; for (const p of ps) S.byPeer[p.peer] = p;
  const h = ps[0]; const wasHost = S.amHost;
  S.hostPeer = h ? h.peer : null; S.amHost = !!(h && h.isMe && h.sameTab);
  if (S.amHost) {
    if (!S.hostG) { S.hostG = S.G ? clone(S.G) : newLobbyG(); S.lastPub = ''; }
    publishG(); hostTick(); return;
  }
  if (wasHost) { pub({ g: null }); S.hostG = null; }
  const g = h && h.presence.g;
  if (g && typeof g === 'object' && MODES[g.mode]) S.G = g;
  clientReact(); scheduleRender();
}

function clientReact() {
  const G = S.G; if (!G || !S.room) return;
  if (G.id !== S.my.gid) {
    S.my = { gid: G.id, words: [], lock: null }; S.pending = null;
    pub({ lock: null, pick: null, wg: G.id, words: [] });
    $('#word-in').value = ''; $('#pick-in').value = '';
  }
  const ti = myTeam();
  if (S.pending && ti >= 0 && G.teams && G.teams[ti]) {
    const tm = G.teams[ti];
    if (G.st === 'over' || tm.r > S.pending.r || (tm.r === S.pending.r && (tm.ph === 'reveal' || tm.ph === 'done'))) {
      S.my.words[S.pending.r - 1] = S.pending.w; S.pending = null;
      pub({ wg: G.id, words: Array.from(S.my.words, x => x || '') });
    }
  }
  if (G.st !== 'lobby' && S.seeking) { S.seeking = null; S.lobby.presence({ seek: null }).catch(() => {}); }
  const want = G.st === 'lobby' ? 'room' : 'game';
  if (S.screen !== want && (S.screen === 'room' || S.screen === 'game' || S.screen === 'queue')) {
    S.screen = want;
    if (want === 'game') setTimeout(() => { const i = $('#word-in'); if (!i.closest('[hidden]')) i.focus(); }, 60);
  }
}

// ---------- host authority ----------
// every phase change stamps the shared clock, so all players see the same countdown
function setPh(tm, ph) { tm.ph = ph; tm.at = now(); }
function startGame() {
  const g = S.hostG; if (!g) return;
  const m = MODES[g.mode]; const ps = S.ps;
  if (ps.length < m.n) { toast(t('needPlayers', { n: m.n })); return; }
  let members;
  if (m.teams === 1) members = [ps.slice(0, m.n).map(p => p.peer)];
  else if (g.auto) members = [[ps[0].peer, ps[1].peer], [ps[2].peer, ps[3].peer]];
  else {
    const a = ps.filter(p => (p.presence.team | 0) === 0).slice(0, 2), b = ps.filter(p => p.presence.team === 1).slice(0, 2);
    if (a.length < 2 || b.length < 2) { toast(t('teamsOf2')); return; }
    members = [a.map(p => p.peer), b.map(p => p.peer)];
  }
  Object.assign(g, { id: g.id + 1, members, topic: g.type === 'rand' ? randTopic(null, g.lang) : null, st: 'count', cAt: now(), teams: [], win: null, why: null });
  if (m.levels) Object.assign(g, { lvl: 1, hp: maxHp(1), lvStart: 1, rl: [1] });
  else { delete g.lvl; delete g.hp; delete g.lvStart; delete g.rl; }
  publishG();
}
function seedRound(tm, words) {
  setPh(tm, 'reveal'); tm.res = 'seed'; tm.fx = null;
  tm.seeds = tm.seeds || {}; tm.seeds[tm.r] = words;
}
function beginPlay(g) {
  g.st = 'play'; g.win = null; g.why = null; S.hostOverAt = 0; S.missing.clear();
  g.teams = g.members.map(() => ({ r: 1, ph: 'word', at: now(), t: g.type === 'rand' ? g.topic : null, res: null, fx: null, seeds: {} }));
  // opening round: random words instead of typed ones (same words for both teams in 2v2)
  const words = pickWords(g.members[0].length, g.lang);
  g.teams.forEach(tm => seedRound(tm, words));
}
function applyCoop(g, tm, res) {
  if (res === 'match') {
    if (g.lvl >= MAX_LV) { tm.fx = 'clear'; g.win = 0; g.why = 'clear'; }
    else {
      g.lvl++; g.hp = maxHp(g.lvl); g.lvStart = tm.r + 1; tm.fx = 'up';
      if (g.type === 'rand') g.topic = randTopic(g.topic, g.lang);
    }
  } else {
    g.hp = Math.max(0, g.hp - 1);
    if (g.hp === 0) { tm.fx = 'dead'; g.win = -1; g.why = 'dead'; } else tm.fx = 'hurt';
  }
}
function hostTick() {
  if (!S.amHost || !S.hostG || !S.room) return;
  const g = S.hostG, P = S.byPeer, clock = Date.now(); let ch = false;
  const coop = isCoop(g);
  if (g.st === 'lobby' && g.auto && g.id === 0 && S.ps.length >= MODES[g.mode].n) { startGame(); return; }
  if (g.st === 'count' && now() - (g.cAt || 0) >= COUNT_MS) { beginPlay(g); ch = true; }
  if (g.st === 'play') {
    for (const m of g.members.flat()) {
      if (P[m]) { S.missing.delete(m); continue; }
      if (!S.missing.has(m)) S.missing.set(m, clock);
      else if (clock - S.missing.get(m) > 5000) { g.st = 'over'; g.win = -2; g.why = 'left'; ch = true; break; }
    }
    if (g.st === 'play') g.teams.forEach((tm, ti) => {
      if (tm.ph === 'done') return;
      const mem = g.members[ti]; const el = phaseEl(tm);
      if (tm.ph === 'pick') {
        const pk = mem[(tm.r - 1) % mem.length]; const pp = P[pk] && P[pk].presence.pick;
        if (pp && pp.g === g.id && pp.r === tm.r && cleanTopic(pp.t)) { tm.t = cleanTopic(pp.t); setPh(tm, 'word'); ch = true; }
        else if (el > PICK_SEC * 1000 + 400) { tm.t = randTopic(null, g.lang); setPh(tm, 'word'); ch = true; }
      } else if (tm.ph === 'word') {
        const locks = mem.map(m => P[m] && P[m].presence.lock);
        const all = locks.every(l => l && l.g === g.id && l.r === tm.r && typeof l.h === 'string');
        if (all || el > WORD_SEC * 1000 + 600) {
          const res = all ? (locks.every(l => l.h === locks[0].h) ? 'match' : 'miss') : 'timeout';
          tm.res = res; ch = true;
          if (coop) { setPh(tm, 'reveal'); applyCoop(g, tm, res); }
          else if (res === 'timeout') { setPh(tm, 'done'); if (g.win == null) { g.win = 1 - ti; g.why = 'timeout'; } }
          else { setPh(tm, 'reveal'); if (res === 'match' && g.win == null) { g.win = ti; g.why = 'match'; } }
        }
      } else if (tm.ph === 'reveal' && el > (tm.res === 'seed' ? SEED_MS : REVEAL_MS)) {
        if (tm.res !== 'seed' && (coop ? g.win != null : tm.res === 'match')) setPh(tm, 'done');
        else {
          // next round: the timer starts again by itself and everyone types a new word
          tm.r++; setPh(tm, g.type === 'turn' ? 'pick' : 'word');
          tm.t = g.type === 'turn' ? null : (g.type === 'rand' ? g.topic : null);
          tm.res = null; tm.fx = null;
          if (coop) g.rl[tm.r - 1] = g.lvl;
          // a new level opens with fresh random words

        }
        ch = true;
      }

    if (g.st === 'play' && g.win != null) {
      if (!S.hostOverAt) S.hostOverAt = clock;
      const settled = g.teams.every(x => x.ph !== 'reveal');
      if (clock - S.hostOverAt > 1300 && settled) { g.st = 'over'; ch = true; }
    }
  }

}

// ---------- matchmaking (same language only) ----------
const seekKey = () => S.lang + '-' + S.mode + '-' + S.type;
function lobbyMe() { return S.lobby && S.lobby.peers().find(p => p.isMe && p.sameTab); }
function startSeek() {
  if (!S.lobby) { toast(t('notConnected')); return; }
  S.seeking = { k: seekKey(), since: Date.now() };
  S.lobby.presence({ v: 1, name: S.name, lang: S.lang, seek: S.seeking }).catch(() => {});
  S.screen = 'queue'; S.qStart = Date.now(); render(); matchTick();
}
function cancelSeek() {
  S.seeking = null; S.lobby && S.lobby.presence({ seek: null }).catch(() => {});
  if (S.room && S.roomKind === 'queue') leaveRoom(); else { S.screen = 'home'; render(); }
}
function seekersFor(k) { return S.lobby ? S.lobby.peers().filter(p => p.presence && p.presence.seek && p.presence.seek.k === k) : []; }
function matchTick() {
  if (!S.seeking || !S.lobby || S.joining) return;
  const me = lobbyMe(); if (!me) return;
  if (S.room) {
    const G = S.G;
    if (S.roomKind === 'queue' && G && G.st === 'lobby' && G.id === 0 && Date.now() - S.roomJoinAt > 15000 && S.ps.length < MODES[G.mode].n) {
      const keep = S.seeking.k; leaveRoom(true).then(() => { S.seeking = { k: keep, since: Date.now() }; S.lobby.presence({ seek: S.seeking }).catch(() => {}); S.screen = 'queue'; render(); });
    }
    return;
  }
  const k = S.seeking.k; const all = seekersFor(k);
  for (const p of all) {
    const s = p.presence.seek;
    if (!(p.isMe && p.sameTab) && s.room && Array.isArray(s.with) && s.with.includes(me.peer)) {
      if (S.seeking.room !== s.room) { S.seeking = { ...S.seeking, room: s.room }; S.lobby.presence({ seek: S.seeking }).catch(() => {}); }
      joinRoom(s.room, 'queue'); return;
    }
  }
  const taken = new Set();
  all.forEach(p => { const s = p.presence.seek; if (s.room) { taken.add(p.peer); (s.with || []).forEach(x => taken.add(x)); } });
  const avail = all.filter(p => !taken.has(p.peer)).sort((a, b) => (a.presence.seek.since - b.presence.seek.since) || (a.peer < b.peer ? -1 : 1));
  const n = MODES[k.split('-')[1]].n;
  if (avail.length >= n && avail[0].isMe && avail[0].sameTab) {
    const grp = avail.slice(0, n).map(p => p.peer);
    const room = ('q-' + k + '-' + hash(grp.join(',') + Date.now())).slice(0, 44);
    S.seeking = { ...S.seeking, room, with: grp };
    S.lobby.presence({ seek: S.seeking }).catch(() => {});
    joinRoom(room, 'queue');
  }
}

// ---------- actions ----------
function submitWord() {
  const G = S.G; const ti = myTeam(); const inp = $('#word-in');
  if (!G || G.st !== 'play' || ti < 0) return;
  const tm = G.teams[ti]; if (tm.ph !== 'word' || (S.my.lock && S.my.lock.r === tm.r)) return;
  const w = norm(inp.value);
  if (!w) { bump(inp); return; }
  if (usedWords(ti).has(w)) { bump(inp); toast(t('used', { w })); return; }
  S.pending = { r: tm.r, w };
  S.my.lock = { g: G.id, r: tm.r, h: hash(w + '|' + S.roomName + '|' + G.id + '|' + ti + '|' + tm.r) };
  pub({ lock: S.my.lock }); inp.value = ''; render();
}
function submitPick(v) {
  const G = S.G; const ti = myTeam(); const topic = cleanTopic(v);
  if (!G || ti < 0 || !topic) { bump($('#pick-in')); return; }
  const tm = G.teams[ti]; if (tm.ph !== 'pick') return;
  pub({ pick: { g: G.id, r: tm.r, t: topic } }); $('#pick-in').value = '';
  S.keys.picked = G.id + '|' + tm.r; render();
}
function bump(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus(); }
function makeCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.random() * A.length | 0]; return s; }

function setLang(l) {
  if (!LANGS.includes(l) || l === S.lang) return;
  S.lang = l; store.set('lang', l);
  if (S.lobby) S.lobby.presence({ lang: l }).catch(() => {});
  if (S.room) pub({ lang: l });
  // a host still in the lobby changes the room language too
  if (S.amHost && S.hostG && S.hostG.st === 'lobby' && !S.hostG.auto) { S.hostG.lang = l; publishG(); }
  // a player in the queue moves to the queue of the new language
  if (S.seeking && !S.room) { S.seeking = { k: seekKey(), since: Date.now() }; S.lobby.presence({ seek: S.seeking }).catch(() => {}); }
  applyStatic(); buildHomeStatic(); S.keys = {}; render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch (act) {
    case 'home': if (!S.room && !S.seeking) { S.screen = 'home'; render(); } break;
    case 'lang': setLang(v); break;
    case 'streamer': S.streamer = !S.streamer; store.set('streamer', S.streamer); applyStreamer(); S.keys = {}; render(); break;
    case 'mode': S.mode = v; store.set('mode', v); render(); break;
    case 'type': S.type = v; store.set('type', v); render(); break;
    case 'seek': startSeek(); break;
    case 'cancel-seek': cancelSeek(); break;
    case 'create': joinRoom('r-' + makeCode().toLowerCase(), 'custom'); break;
    case 'leave': leaveRoom(); break;
    case 'copy': {
      const code = S.roomName.slice(2).toUpperCase();
      try { navigator.clipboard.writeText(code).then(() => toast(t('copied', { c: code })), () => selectCode()); } catch { selectCode(); }
      break;
    }
    case 'g-mode': if (S.amHost && S.hostG && S.hostG.st === 'lobby') { S.hostG.mode = v; publishG(); } break;
    case 'g-type': if (S.amHost && S.hostG && S.hostG.st === 'lobby') { S.hostG.type = v; publishG(); } break;
    case 'team': { const cur = pres(myPeer()).team | 0; pub({ team: 1 - cur }); break; }
    case 'start': case 'restart': startGame(); break;
    case 'again': if (S.amHost && S.hostG) { Object.assign(S.hostG, { st: 'lobby', teams: [], win: null, why: null }); publishG(); } break;
    case 'requeue': { const m = S.G ? S.G.mode : S.mode, ty = S.G ? S.G.type : S.type; leaveRoom(true).then(() => { S.mode = m; S.type = ty; startSeek(); }); break; }
    case 'sugg': submitPick(v); break;
  }
});
function selectCode() { const el = document.querySelector('.code'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('selectCopy')); }
$('#word-form').addEventListener('submit', e => { e.preventDefault(); submitWord(); });
$('#pick-form').addEventListener('submit', e => { e.preventDefault(); submitPick($('#pick-in').value); });
$('#join-form').addEventListener('submit', e => {
  e.preventDefault();
  const c = $('#join-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 4) { bump($('#join-code')); toast(t('code4')); return; }

});
$('#name-in').addEventListener('input', e => {
  S.name = e.target.value.trim().slice(0, 18) || t('anon'); store.set('name', S.name);
  S.lobby && S.lobby.presence({ name: S.name }).catch(() => {});
});
$('#join-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });

// inputs hide their letters too; browsers without -webkit-text-security fall back to a password field

// ---------- render ----------
let rq = false;
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function setHTML(el, keyName, html) { if (S.keys[keyName] !== html) { S.keys[keyName] = html; el.innerHTML = html; } }

function render() {
  for (const id of ['home', 'queue', 'room', 'game']) $('#sc-' + id).hidden = S.screen !== id;
  document.body.classList.toggle('in-game', S.screen === 'game');
  renderTop();
  if (S.screen === 'home') renderHome();
  else if (S.screen === 'queue') renderQueue();
  else if (S.screen === 'room') renderRoom();
  else if (S.screen === 'game') renderGame();
  renderOver();
}

function renderTop() {
  const dot = $('#net-dot'), txt = $('#net-txt');
  dot.className = 'dot';
  if (S.net === 'online' && S.connected) { dot.classList.add('on'); txt.textContent = t('connected'); } else if (S.net === 'online' && S.connected === false) { dot.classList.add('warn'); txt.textContent = t('reconnecting'); }
  else if (S.net === 'offline') { dot.classList.add('off'); txt.textContent = t('offline'); }
  else txt.textContent = t('connecting');
  const b = S.net === 'online' && !S.connected ? `<div class="banner">${t('bannerWake')}</div>` : '';
  if ($('#banner').innerHTML !== b) $('#banner').innerHTML = b;
}

function renderHome() {
  document.querySelectorAll('[data-act="mode"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.mode));
  document.querySelectorAll('[data-act="type"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.type));
  const ok = S.net === 'online' && S.connected;
  ['#seek-btn', '#create-btn', '#join-btn'].forEach(s => $(s).disabled = !ok);
  // live queue counts, only for my language
  const counts = {}; if (S.lobby) for (const p of S.lobby.peers()) { const s = p.presence && p.presence.seek; if (s && s.k && !s.room) counts[s.k] = (counts[s.k] || 0) + 1; }
  document.querySelectorAll('[data-q]').forEach(el => { const pre = S.lang + '-' + el.dataset.q + '-'; const n = Object.keys(counts).filter(x => x.startsWith(pre)).reduce((a, x) => a + counts[x], 0); el.textContent = n ? t('searching', { n }) : ''; });
  document.querySelectorAll('[data-qt]').forEach(el => { const n = counts[S.lang + '-' + S.mode + '-' + el.dataset.qt] || 0; el.textContent = n ? t('searching', { n }) : ''; });
}

function renderQueue() {
  const k = S.seeking ? S.seeking.k : seekKey(); const [l, m, ty] = k.split('-');
  $('#q-info').textContent = `${t('modes')[m][0]} · ${t('types')[ty][0]} · ${t('langName')[l]}`;
  const n = seekersFor(k).filter(p => !p.presence.seek.room).length;
  $('#q-count').textContent = `${Math.max(1, Math.min(n, MODES[m].n))}/${MODES[m].n}`;
}

function renderRoom() {
  const el = $('#sc-room'); const G = S.G;
  if (!G) { setHTML(el, 'room-wait', `<div class="card center" style="padding:40px">${t('loadingRoom')}</div>`); return; }
  const m = MODES[G.mode], ps = S.ps, me = myPeer(), host = S.amHost;
  const code = S.roomName.slice(2).toUpperCase();
  const tagOf = p => `${p.peer === S.hostPeer ? `<span class="tag host">${t('hostTag')}</span>` : ''}${p.peer === me ? `<span class="tag you">${t('youTag')}</span>` : ''}`;
  const slot = p => p ? `<div class="slot">${avatar(p.peer)}<span class="nm">${esc(pName(p.peer))}</span>${tagOf(p)}</div>` : `<div class="slot empty">${t('waitingP')}</div>`;
  let players = '';
  if (m.teams === 1 || G.auto) {
    const list = ps.slice(0, m.n), extra = ps.slice(m.n);
    players = `<div class="slots row" style="grid-template-columns:repeat(${m.n},minmax(0,1fr))">${Array.from({ length: m.n }, (_, i) => slot(list[i])).join('')}</div>` +
      (extra.length ? `<p class="muted" style="margin:10px 0 0">${t('spectators')}: ${extra.map(p => esc(pName(p.peer))).join(', ')}</p>` : '');
  } else {
    const tl = [0, 1].map(i => ps.filter(p => (p.presence.team | 0) === i));
    players = `<div class="teams">${[0, 1].map(i => `<div class="team"><h4><span class="dot" style="background:var(--${TEAM_COLS[i]})"></span>${teamName(i)}</h4><div class="slots">${[0, 1].map(j => slot(tl[i][j])).join('')}${tl[i].slice(2).map(p => `<div class="slot">${avatar(p.peer)}<span class="nm">${esc(pName(p.peer))}</span><span class="tag">${t('extra')}</span></div>`).join('')}</div></div>`).join('')}</div>
      <div style="margin-top:12px;text-align:center"><button class="btn sm" data-act="team">${t('switchTeam')}</button></div>`;
  }

  const head = S.roomKind === 'custom'
    ? `<div class="code-box"><div class="code">${[...code].map(c => `<span>${esc(S.streamer ? '*' : c)}</span>`).join('')}</div><div><div style="font-weight:700">${t('codeLbl')}</div><div class="muted" style="font-size:13.5px">${t('codeHint')}</div><button class="btn sm" data-act="copy" style="margin-top:8px">${t('copy')}</button></div></div>`
    : `<div><div style="font-family:var(--f-display);font-size:26px;font-weight:800">${ps.length >= m.n ? t('matched') : t('gathering')}</div><div class="muted">${G.id === 0 ? t('autoStart') : t('hostNext')}</div></div>`;
  const md = t('modes'), ty = t('types');
  const seg = (act, keys, names, cur) => `<div class="seg">${keys.map(k => `<button class="chip" data-act="${act}" data-v="${k}" aria-pressed="${k === cur}" ${host && !G.auto ? '' : 'disabled'}>${names[k][0]}</button>`).join('')}</div>`;
  const html = `<div class="card">
      <div class="room-top">${head}<button class="btn ghost sm" data-act="leave">${t('leave')}</button></div>
      <p class="langnote">${t('roomLang', { l: t('langName')[roomLang()] })}</p>
      <h2 class="lbl">${t('modeLbl')} ${host && !G.auto ? '' : `<span style="text-transform:none;letter-spacing:0">${t('hostPicks')}</span>`}</h2>${seg('g-mode', Object.keys(MODES), md, G.mode)}
      ${m.levels ? `<p class="muted" style="margin:8px 0 0;font-size:13.5px">${t('levelsNote')}</p>` : ''}
      <h2 class="lbl">${t('topicLbl')}</h2>${seg('g-type', Object.keys(TYPES), ty, G.type)}
      <h2 class="lbl">${t('players')} · ${Math.min(ps.length, m.n)}/${m.n}</h2>${players}
      <div class="foot">
        <span class="muted">${host ? (ready ? t('readyGo') : t('needN', { n: m.n }) + (m.teams > 1 ? t('perTeam') : '') + '.') : t('waitHost', { h: esc(pName(S.hostPeer)) })}</span>
        ${host && !(G.auto && G.id === 0) ? `<button class="btn primary big" data-act="start" ${ready ? '' : 'disabled'}>${t('start')}</button>` : ''}
      </div>
    </div>`;
  setHTML(el, 'room', html);
}

function renderHud() {
  const G = S.G, hud = $('#g-hud');
  if (!isCoop(G) || !G.lvl) { hud.hidden = true; return; }
  hud.hidden = false;
  const lv = G.lvl, hp = G.hp, mx = maxHp(lv);
  const prev = S.hpSeen; let lost = [], gained = false, pop = false;
  if (prev && prev.gid === G.id) {
    if (prev.lvl === lv && hp < prev.hp) for (let i = hp; i < prev.hp; i++) lost.push(i);
    if (lv > prev.lvl) { gained = true; pop = true; }
  }
  if (!prev || prev.gid !== G.id || prev.lvl !== lv || prev.hp !== hp) S.hpSeen = { gid: G.id, lvl: lv, hp };
  const hearts = Array.from({ length: mx }, (_, i) => `<svg viewBox="0 0 24 24" class="${i < hp ? 'f' : 'e'} ${lost.includes(i) ? 'lost' : ''} ${gained ? 'gain' : ''}" style="${gained ? `animation-delay:${i * 30}ms` : ''}">${HEART}</svg>`).join('');
  const path = Array.from({ length: MAX_LV }, (_, i) => {
    const n = i + 1; const cls = n < lv ? 'done' : n === lv ? 'cur' : '';
    return `${i ? `<i class="${n <= lv ? 'on' : ''}"></i>` : ''}<span class="${cls} ${n === MAX_LV ? 'crown' : ''}">${n === MAX_LV ? '👑' : n}</span>`;
  }).join('');
  const html = `<div class="path" aria-label="Level">${path}</div>
    <div class="hud-mid">
      <div class="lv"><div class="lv-badge ${lv === MAX_LV ? 'boss' : ''} ${pop ? 'pop' : ''}"><small>LEVEL</small><b>${lv}</b></div>
        <div class="lv-txt"><b>${lv === MAX_LV ? t('boss') : `⭐ Level ${lv}`}</b><span>${lv === MAX_LV ? t('bossSub') : t('nextLv', { n: lv + 1 })}</span></div></div>
      <div class="hearts-row"><div class="hearts" aria-label="${t('lives', { h: hp })}">${hearts}</div><span class="hp-n">${hp}<small>/${mx}</small></span></div>
    </div>`;
  if (lost.length || pop || S.keys.hud !== html.replace(/ (lost|gain|pop)/g, '')) {
    S.keys.hud = html.replace(/ (lost|gain|pop)/g, '');
    hud.innerHTML = html;
  }
}

const ringHTML = ti => `<div class="ring" data-t="${ti}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52" fill="none" stroke-width="9"/><circle class="bar" cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0"/></svg><div class="num"><span class="tn">30</span><small class="tp">${t('secs')}</small></div></div>`;

// does the game carry on after this reveal? (then show the countdown to the next round)
function continues(G, tm) { if (tm.res === 'seed') return true; return isCoop(G) ? G.win == null : tm.res !== 'match'; }

function verdictHTML(G, tm, ti) {
  const coop = isCoop(G);
  const nx = continues(G, tm) ? `<div class="nextin" data-t="${ti}"></div>` : '';
  if (tm.res === 'seed') return `<div class="dice">🎲</div><div class="verdict mid">${t('seedV')}</div><div class="vsub">${t('seedSub')}</div>${nx}`;
  let v, sub = '';
  if (tm.res === 'match') v = `<div class="verdict good">${tm.fx === 'clear' ? t('clear') : t('match')}</div>`;
  else if (tm.res === 'miss') v = `<div class="verdict mid">${t('miss')}</div>`;
  else v = `<div class="verdict bad">${t('timeout')}</div>`;
  if (coop) {
    if (tm.fx === 'up') sub = `<div class="vsub up">${t('upSub', { l: G.lvl, h: maxHp(G.lvl) })}</div>`;
    else if (tm.fx === 'clear') sub = `<div class="vsub up">${t('clearSub')}</div>`;
    else if (tm.fx === 'hurt') sub = `<div class="vsub hurt">${t('hurtSub', { h: G.hp })}</div>`;
    else if (tm.fx === 'dead') sub = `<div class="vsub hurt">${t('deadSub')}</div>`;
  } else if (tm.res === 'miss') sub = `<div class="vsub">${t('missSub')}</div>`;
  return v + sub + nx;
}

function arenaHTML(G, ti) {
  const m = MODES[G.mode], coop = isCoop(G), vs = m.teams > 1, me = myPeer(), mt = myTeam();
  const mem = (G.members && G.members[ti]) || [];
  const tm = G.teams && G.teams[ti];
  const hideTyped = vs && mt >= 0 && mt !== ti && G.st !== 'over';
  let round = t('prep'), topic, topicNone = false, mid, seatsCls = '', slotOf;
  if (!tm || G.st === 'count') {
    topic = G.type === 'rand' && G.topic ? `${t('topicIs')}<span class="k">${esc(G.topic)}</span>` : (G.type === 'turn' ? t('turnPrep') : (coop ? t('coopPrep') : t('noTopicPrep')));
    mid = ringHTML(ti);
    slotOf = () => `<div class="cap">${t('ready')}</div>`;
  } else {
    const picker = mem[(tm.r - 1) % mem.length];
    const isSeed = tm.res === 'seed';
    round = (coop ? `Level ${(G.rl && G.rl[tm.r - 1]) || G.lvl} · ` : '') + t('round', { n: tm.r }) + (isSeed ? t('seedTag') : '');
    topic = tm.t ? `${t('topicIs')}<span class="k">${esc(tm.t)}</span>` : (tm.ph === 'pick' ? t('picking', { p: `<span class="k">${esc(pName(picker))}</span>` }) : (isSeed ? t('seedOpen') : t('anything')));
    topicNone = !tm.t && tm.ph !== 'pick';
    if (tm.ph === 'reveal' || tm.ph === 'done') {
      mid = verdictHTML(G, tm, ti);
      seatsCls = isSeed ? 'seed' : tm.res === 'match' ? 'match' : tm.res === 'miss' ? 'miss' : '';
      const ws = roundWords(ti, tm.r);
      slotOf = (p, i) => {
        const w = ws[i];
        if (hideTyped && !isSeed) return '<div class="wc"><div class="w wait">•••</div></div>';
        if (typeof w === 'string' && w) return `<div class="wc"><div class="w">${esc(mask(w))}</div></div>`;
        return `<div class="wc"><div class="w wait">${tm.res === 'timeout' ? '—' : '…'}</div></div>`;
      };
    } else {
      mid = ringHTML(ti);
      slotOf = p => {
        if (tm.ph === 'pick') return p === picker ? `<div class="cap">${t('choosing')}</div>` : `<div class="cap">${t('waitTopic')}</div>`;
        const l = pres(p).lock; const locked = p === me ? (S.my.lock && S.my.lock.r === tm.r) : (l && l.g === G.id && l.r === tm.r);
        return locked ? `<div class="cap ok">${t('locked')}</div>` : `<div class="cap">${t('typing')}<span class="typing"><i></i><i></i><i></i></span></div>`;
      };
    }
  }
  const seats = mem.map((p, i) => {
    const l = pres(p).lock, ok = tm && tm.ph === 'word' && (p === me ? (S.my.lock && S.my.lock.r === tm.r) : (l && l.g === G.id && l.r === tm.r));
    return `<div class="seat s${i} ${ok ? 'ok' : ''}" style="--c:var(--${pCol(p)})">${avatar(p)}<div class="nm">${esc(pName(p))}${p === me ? t('youSuffix') : ''}</div><div class="wslot">${slotOf(p, i)}</div></div>`;
  }).join('');
  const myCol = Math.max(0, mt);
  return `<div class="arena t${ti} ${vs ? 'compact' : ''} ${vs && ti === mt ? 'mine' : ''}" data-t="${ti}" style="order:${ti === myCol ? 0 : 2}">
    ${vs ? `<div class="team-tag"><span class="dot" style="background:var(--${TEAM_COLS[ti]})"></span>${teamName(ti)}${ti === mt ? `<small>${t('yourTeam')}</small>` : ''}</div>` : ''}
    <div class="round-no">${round}</div>
    <div class="topic ${topicNone ? 'none' : ''}">${topic}</div>
    <div class="seats n${mem.length} ${seatsCls}">${seats}<div class="mid">${mid}</div></div>
  </div>`;
}

function renderGame() {
  const G = S.G; if (!G) return;
  const ti = dispTeam(), mt = myTeam(), me = myPeer();
  const m = MODES[G.mode]; const vs = m.teams > 1;
  setHTML($('#g-meta'), 'meta', [
    S.roomKind === 'custom' ? `<span class="pill">${t('metaRoom')} <b style="color:var(--ink);font-family:var(--f-mono)">${esc(mask(S.roomName.slice(2).toUpperCase()))}</b></span>` : `<span class="pill">${t('metaQuick')}</span>`,
    `<span class="pill">${t('modes')[G.mode][0]}</span>`, `<span class="pill">${t('types')[G.type][0]}</span>`,
    `<span class="pill">${roomLang().toUpperCase()}</span>`,
    mt < 0 ? `<span class="pill">${t('watching')}</span>` : '',
  ].join(''));
  renderHud();
  $('#g-board').classList.toggle('vs', vs);
  setHTML($('#g-arenas'), 'arenas', (vs ? [0, 1] : [0]).map(x => arenaHTML(G, x)).join(''));
  const ctl = $('#g-controls'); ctl.style.gridColumn = vs ? String(ti + 1) : ''; ctl.style.order = '1';

  const wf = $('#word-form'), pf = $('#pick-form'), sg = $('#pick-sugg'), note = $('#g-note');
  let showWord = false, showPick = false, noteHtml = '';
  const mem = (G.members && G.members[ti]) || [];
  if (G.st === 'count' || !G.teams || !G.teams[ti]) {
    noteHtml = t('prepNote');
  } else {
    const tm = G.teams[ti];
    const picker = mem[(tm.r - 1) % mem.length];
    if (tm.ph === 'reveal' || tm.ph === 'done') {
      if (tm.res === 'seed') noteHtml = t('seedNote');
      else if (tm.ph === 'reveal' && continues(G, tm) && tm.res !== 'match') noteHtml = t('missNote');
      const ck = G.id + '|' + ti + '|' + tm.r;
      if (tm.res === 'match' && !S.celebrated.has(ck)) { S.celebrated.add(ck); tm.fx === 'clear' ? fireworks() : confetti(); }
    } else if (tm.ph === 'word') {
      const locked = S.my.lock && S.my.lock.r === tm.r;
      const prev = tm.seeds && tm.seeds[tm.r - 1];
      if (mt < 0) noteHtml = t('watchNote');
      else if (locked) noteHtml = t('lockedNote', { w: esc(mask(S.pending ? S.pending.w : '')) });
      else {
        showWord = true;
        noteHtml = prev ? t('linkNote', { a: prev.map(w => esc(mask(w))).join(t('linkJoin')) }) : t('againNote');
      }
    } else if (tm.ph === 'pick') {
      const iAmPicker = picker === me;
      if (iAmPicker && S.keys.picked !== G.id + '|' + tm.r) {
        showPick = true; noteHtml = t('pickNote');
        const list = TOPICS[roomLang()] || TOPICS.vi;
        const sugg = []; let s = parseInt(hash(G.id + '|' + ti + '|' + tm.r).slice(0, 6), 36);
        while (sugg.length < 4) { const x = list[s % list.length]; if (!sugg.includes(x)) sugg.push(x); s = Math.floor(s / 7) + 13 * sugg.length + 1; }
        setHTML(sg, 'sugg', sugg.map(x => `<button type="button" class="chip" data-act="sugg" data-v="${esc(x)}">${esc(x)}</button>`).join(''));
      } else noteHtml = iAmPicker ? t('sentTopic') : t('waitPick', { p: esc(pName(picker)) });
    }
  }
  const wasHidden = wf.hidden;
  wf.hidden = !showWord; pf.hidden = !showPick; sg.hidden = !showPick;
  // the next round opens the input again and puts the cursor in it
  if (showWord && wasHidden && S.screen === 'game') setTimeout(() => $('#word-in').focus(), 30);
  if (note.innerHTML !== noteHtml) note.innerHTML = noteHtml;
  note.hidden = !noteHtml;

  renderHist();
}

function histTable(ti, hide) {
  const G = S.G, coop = isCoop(G); const mem = (G.members && G.members[ti]) || []; const tm = G.teams && G.teams[ti];
  if (!tm) return `<p class="empty-hist">${t('histNone')}</p>`;
  const doneRounds = (tm.ph === 'reveal' || tm.ph === 'done') ? tm.r : tm.r - 1;
  if (doneRounds < 1) return `<p class="empty-hist">${t('histAfter')}</p>`;
  const two = mem.length === 2;
  let rows = '';
  for (let r = doneRounds; r >= 1; r--) {
    const ws = roundWords(ti, r); const seed = !!(tm.seeds && tm.seeds[r]);
    const match = !seed && ws.every(w => w) && ws.every(w => norm(w) === norm(ws[0]));
    const lv = coop && G.rl ? G.rl[r - 1] : null;
    const cell = w => (hide && !seed) ? '•••' : (w ? esc(mask(w)) : '<span style="color:var(--dim)">—</span>');
    const c = `<td class="c">${r}${lv ? ' · ' + (lv === MAX_LV ? '👑' : 'Lv' + lv) : ''} ${seed ? '🎲' : match ? '⭐' : (coop ? '💔' : '')}</td>`;
    rows += `<tr class="${match ? 'match' : ''} ${seed ? 'seedrow' : ''}">` + (two ? `<td class="l">${cell(ws[0])}</td>${c}<td>${cell(ws[1])}</td>` : c + ws.map(w => `<td>${cell(w)}</td>`).join('')) + '</tr>';
  }
  const head = two ? `<th class="l">${esc(pName(mem[0]))}</th><th class="c">${t('roundCol')}</th><th>${esc(pName(mem[1]))}</th>` : `<th class="c">${t('roundCol')}</th>${mem.map(p => `<th>${esc(pName(p))}</th>`).join('')}`;
  return `<div class="tbl-wrap"><table class="sym"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderHist() {
  const G = S.G, el = $('#g-hist');
  if (MODES[G.mode].teams === 1) { setHTML(el, 'hist', histTable(0, false)); return; }
  const mt = myTeam();
  setHTML(el, 'hist', `<div class="hist-grid">${[0, 1].map(x => `<div><h4><span class="dot" style="background:var(--${TEAM_COLS[x]})"></span>${teamName(x)}</h4>${histTable(x, mt >= 0 && mt !== x && G.st !== 'over')}</div>`).join('')}</div>`);
}

function renderOver() {
  const ov = $('#over'), G = S.G;
  if (S.screen !== 'game' || !G || G.st !== 'over') { ov.hidden = true; S.keys.over = ''; return; }
  ov.hidden = false;
  const mt = myTeam(), m = MODES[G.mode]; const coop = isCoop(G);
  const tm = G.teams && G.teams[Math.max(0, G.win)];
  let html, celebrate = null;
  const waitTxt = `<span class="muted">${t('waitRestart', { h: esc(pName(S.hostPeer)) })}</span>`;
  const leaveBtn = (S.roomKind === 'queue' ? `<button class="btn" data-act="requeue">${t('requeue')}</button>` : '') + `<button class="btn ghost" data-act="leave">${t('leave')}</button>`;
  if (G.win === -2) {
    html = `<div class="big-emoji">🚪</div><div class="verdict mid">${t('leftT')}</div><p class="muted" style="margin:0">${t('leftSub')}</p>
      <div class="acts">${S.amHost ? `<button class="btn primary" data-act="again">${t('backLobby')}</button>` : ''}${leaveBtn}</div>`;
  } else if (coop) {
    const rounds = tm ? tm.r : 0;
    if (G.why === 'clear') {
      html = `<div class="big-emoji">🏆</div><div class="verdict good">${t('clearT')}</div>
        <p class="muted" style="margin:0">${t('clearBody', { n: m.n, w: esc(mask(wordsOf(G.members[0][0])[rounds - 1] || '')) })}</p>
        <div class="title-badge"><small>${t('titleUnlocked')}</small><b>${t('TITLE')}</b></div>
        <div class="stats"><div><b>${rounds}</b>${t('statRounds')}</div><div><b>${G.hp}</b>${t('statLives')}</div></div>
        <div class="acts">${S.amHost ? `<button class="btn gold" data-act="restart">${t('restart')}</button>` : waitTxt}${leaveBtn}</div>`;
      celebrate = 'fireworks';
    } else {
      html = `<div class="big-emoji">💀</div><div class="verdict bad">GAME OVER</div>
        <p class="muted" style="margin:0">${t('deadBody', { l: G.lvl === MAX_LV ? '👑 Level 10' : '⭐ Level ' + G.lvl, r: rounds, who: m.n === 2 ? t('who2') : t('who3') })}</p>
        <div class="stats"><div><b>${G.lvl - 1}</b>${t('statLv')}</div><div><b>${rounds}</b>${t('statPlayed')}</div></div>
        <div class="acts">${S.amHost ? `<button class="btn primary" data-act="restart">${t('restart20')}</button>` : waitTxt}${leaveBtn}</div>`;
    }
  } else {
    const winTeam = G.win, how = G.why === 'match' ? t('howMatch', { r: G.teams[winTeam].r }) : t('howTimeout');
    let title, cls, sub;
    if (mt < 0) { title = t('teamWins', { t: teamName(winTeam) }); cls = 'good'; sub = `${teamName(winTeam)} ${how}.`; }
    else if (mt === winTeam) { title = t('youWin'); cls = 'good'; sub = `${t('yourTeam')} ${how}.`; }
    else { title = t('theyWin'); cls = 'bad'; sub = G.why === 'match' ? `${teamName(winTeam)} ${t('howMatch', { r: G.teams[winTeam].r })}.` : t('yourTimeout'); }
    html = `<div class="big-emoji">${cls === 'good' ? '🎉' : '😵'}</div><div class="verdict ${cls}">${title}</div><p class="muted" style="margin:0">${sub}</p>
      <div class="acts">${S.amHost ? `<button class="btn primary" data-act="again">${t('newGame')}</button>` : waitTxt}${leaveBtn}</div>`;
    if (cls === 'good') celebrate = 'confetti';
  }
  setHTML($('#over-box'), 'over', html);
  if (celebrate && !S.celebrated.has('over' + G.id)) { S.celebrated.add('over' + G.id); celebrate === 'fireworks' ? fireworks(true) : confetti(); }
}

// ---------- timer ui loop (all timers read the shared server clock) ----------
function uiLoop() {
  requestAnimationFrame(uiLoop);
  if (S.screen === 'queue') { const s = Math.floor((Date.now() - S.qStart) / 1000); const x = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if ($('#q-time').textContent !== x) $('#q-time').textContent = x; }
  const G = S.G; if (S.screen !== 'game' || !G) return;
  document.querySelectorAll('#g-arenas .ring').forEach(ring => {
    const ti = +ring.dataset.t; let total, el, label;
    if (G.st === 'count') { total = COUNT_MS / 1000; el = now() - (G.cAt || now()); label = t('startL'); }
    else if (G.teams && G.teams[ti]) {
      const tm = G.teams[ti];
      if (tm.ph === 'pick') { total = PICK_SEC; label = t('pickL'); } else if (tm.ph === 'word') { total = WORD_SEC; label = t('secs'); } else return;
      el = phaseEl(tm);
    } else return;
    const rem = Math.max(0, total * 1000 - el);
    const num = String(Math.ceil(rem / 1000));
    ring.querySelector('.bar').setAttribute('stroke-dashoffset', (RING_C * (1 - rem / (total * 1000))).toFixed(2));
    const tn = ring.querySelector('.tn'), tp = ring.querySelector('.tp');
    if (tn.textContent !== num) tn.textContent = num;
    if (tp.textContent !== label) tp.textContent = label;
    ring.classList.toggle('urgent', G.st === 'play' && rem < 5500);
  });
  document.querySelectorAll('#g-arenas .nextin').forEach(nx => {
    const tm = G.teams && G.teams[+nx.dataset.t]; if (!tm || tm.ph !== 'reveal') { nx.textContent = ''; return; }
    const rem = Math.max(0, (tm.res === 'seed' ? SEED_MS : REVEAL_MS) - phaseEl(tm));
    const x = t('nextIn', { s: Math.ceil(rem / 1000) }); if (nx.textContent !== x) nx.textContent = x;
  });
}

// ---------- effects: confetti + fireworks ----------
const FXC = ['#ff8f5e', '#5ec4ff', '#ffd166', '#c6a0ff', '#74e3b0', '#ff5f8f'];
let fxParts = [], fxRun = false;
function fxStart() {
  if (fxRun) return; fxRun = true;
  const cv = $('#fx'), ctx = cv.getContext('2d');
  const step = () => {
    const dpr = devicePixelRatio || 1;
    if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    const next = [];
    for (const p of fxParts) {
      p.t++; if (p.delay > 0) { p.delay--; next.push(p); continue; }
      if (p.kind === 'rocket') {
        p.x += p.vx; p.y += p.vy; p.vy += .12;
        ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 7); ctx.fill();
        if (p.vy >= -1) { const c = FXC[Math.random() * FXC.length | 0], c2 = FXC[Math.random() * FXC.length | 0]; for (let i = 0; i < 70; i++) { const a = Math.random() * 6.283, s = Math.random() * 5.5 + 1; next.push({ kind: 'spark', x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c: i % 3 ? c : c2, life: 60 + Math.random() * 30, t: 0, delay: 0 }); } }
        else next.push(p);
        continue;
      }
      if (p.kind === 'spark') {
        p.vx *= .97; p.vy = p.vy * .97 + .07; p.x += p.vx; p.y += p.vy;
        const a = 1 - p.t / p.life; if (a <= 0) continue;
        ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        next.push(p); continue;
      }
      p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > innerHeight + 30) continue;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore(); next.push(p);
    }
    fxParts = next;
    if (fxParts.length) requestAnimationFrame(step); else { fxRun = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  };
  requestAnimationFrame(step);
}
function confetti() {
  if (reduce) return;
  for (let i = 0; i < 150; i++) fxParts.push({ kind: 'conf', x: innerWidth / 2, y: innerHeight * .42, vx: (Math.random() - .5) * 16, vy: -Math.random() * 13 - 3, s: 4 + Math.random() * 6, c: FXC[Math.random() * FXC.length | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4, round: Math.random() < .4, t: 0, delay: 0 });
  fxStart();
}
function fireworks(big) {
  if (reduce) return;
  const n = big ? 16 : 6;
  for (let i = 0; i < n; i++) fxParts.push({ kind: 'rocket', x: innerWidth * (.15 + Math.random() * .7), y: innerHeight + 10, vx: (Math.random() - .5) * 2, vy: -(9 + Math.random() * 4) * Math.sqrt(innerHeight / 800), t: 0, delay: i * (big ? 14 : 18) });
  if (big) confetti();
  fxStart();
}

// ---------- background: drifting keycaps ----------
function startBg() {
  const cv = $('#bg'), ctx = cv.getContext('2d');
  const letters = 'AĂÂBCDĐEÊGHIKLMNOÔƠPQRSTUƯVWXYZ1'.split('');
  const cols = ['#ff8f5e', '#5ec4ff', '#c6a0ff', '#ffd166', '#74e3b0'];
  let W = 0, H = 0, tiles = [];
  const resize = () => {
    const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(34, Math.max(14, W * H / 32000)));
    tiles = Array.from({ length: count }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 28 + Math.random() * 30, v: .18 + Math.random() * .35, r: (Math.random() - .5) * .5, vr: (Math.random() - .5) * .003, l: letters[Math.random() * letters.length | 0], c: cols[Math.random() * cols.length | 0], a: .14 + Math.random() * .16 }));
  };
  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of tiles) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = p.a;
      const s = p.s, rr = s * .22;
      ctx.strokeStyle = p.c; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-s / 2, -s / 2, s, s, rr) : ctx.rect(-s / 2, -s / 2, s, s);
      ctx.globalAlpha = p.a * .35; ctx.fillStyle = p.c; ctx.fill(); ctx.globalAlpha = p.a; ctx.stroke();
      ctx.fillStyle = p.c; ctx.font = `800 ${s * .46}px 'JetBrains Mono', monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.l, 0, 1);
      ctx.restore();
    }
  };
  const loop = () => {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    for (const p of tiles) { p.y -= p.v; p.r += p.vr; if (p.y < -40) { p.y = H + 40; p.x = Math.random() * W; } }
    draw();
  };
  resize(); addEventListener('resize', resize);
  if (reduce) draw(); else requestAnimationFrame(loop);
}

// ---------- hero typing demo ----------
const DEMO = {
  vi: [
    { a: 'biển', b: 'núi', seed: true, lv: 1, hp: 20, r: 1 }, { a: 'du lịch', b: 'du lịch', lv: 1, hp: 20, r: 2 },
    { a: 'mèo', b: 'trăng', seed: true, lv: 2, hp: 18, r: 3 }, { a: 'đêm', b: 'cú', lv: 2, hp: 18, r: 4 }, { a: 'bóng tối', b: 'bóng tối', lv: 2, hp: 17, r: 5 },
  ],
  en: [
    { a: 'ocean', b: 'mountain', seed: true, lv: 1, hp: 20, r: 1 }, { a: 'travel', b: 'travel', lv: 1, hp: 20, r: 2 },
    { a: 'cat', b: 'moon', seed: true, lv: 2, hp: 18, r: 3 }, { a: 'night', b: 'owl', lv: 2, hp: 18, r: 4 }, { a: 'darkness', b: 'darkness', lv: 2, hp: 17, r: 5 },
  ],
};
async function heroDemo() {
  const f1 = $('#d1'), f2 = $('#d2'), res = $('#d-res'), t1 = f1.querySelector('.txt'), t2 = f2.querySelector('.txt');
  const show = s => { $('#d-round').textContent = s.r; $('#d-lv').textContent = s.lv; $('#d-hp').textContent = s.hp; };
  if (reduce) { const s = DEMO[S.lang][1]; show(s); t1.textContent = s.a; t2.textContent = s.b; f1.classList.add('hit'); f2.classList.add('hit'); res.textContent = t('matchRes'); res.className = 'demo-res good'; return; }
  for (;;) {
    const lang = S.lang;
    for (const s of DEMO[lang]) {
      while (S.screen !== 'home' || document.hidden) await sleep(500);
      if (S.lang !== lang) break;
      show(s); t1.textContent = ''; t2.textContent = ''; f1.className = 'kf'; f2.className = 'kf'; res.textContent = ''; res.className = 'demo-res';
      await sleep(500);
      if (s.seed) {
        t1.textContent = s.a; t2.textContent = s.b; f1.classList.add('seed'); f2.classList.add('seed');
        res.textContent = t('seedRes'); res.className = 'demo-res seed';
        await sleep(1900); continue;
      }
      const a = [...s.a], b = [...s.b], n = Math.max(a.length, b.length);
      for (let i = 0; i < n; i++) {
        if (i < a.length) t1.textContent += a[i];
        await sleep(55 + Math.random() * 60);
        if (i < b.length) t2.textContent += b[i];
        await sleep(55 + Math.random() * 60);
      }
      await sleep(450);
      const ok = s.a === s.b;
      f1.classList.add(ok ? 'hit' : 'off'); f2.classList.add(ok ? 'hit' : 'off');
      res.textContent = ok ? t('matchRes') : t('missRes');
      res.className = 'demo-res ' + (ok ? 'good' : 'bad');
      await sleep(ok ? 1900 : 1400);
    }
  }
}
